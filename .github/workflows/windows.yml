# Windows build + cross-platform correctness gate.
#
# Builds combosolver.exe with MSVC at this commit, then runs tools/ci/gate.py:
# the reference replay against pinned card data and scripts, with the report's
# platform-invariant lines compared byte-for-byte to the committed reference
# (generated by a macOS build). A pass means the two platforms re-execute the
# same duel to the same board — the fingerprint cross-check.
#
# The layout mirrors what tools/fetch_solver_deps.ps1 expects: this repo
# checked out one level below a root that carries the edopro/ clone.
name: windows

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  build-and-gate:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          path: ygo-combo-solver
          fetch-depth: 0 # the gate replay is extracted from history (c9b9821)

      - name: Cache EDOPro sources
        id: edopro-cache
        uses: actions/cache@v4
        with:
          path: edopro
          key: edopro-ocgcore-5a985af-lua

      - name: Clone EDOPro sources
        if: steps.edopro-cache.outputs.cache-hit != 'true'
        run: |
          git clone --depth 1 https://github.com/edo9300/edopro edopro
          git -C edopro submodule update --init ocgcore
          git -C edopro/ocgcore fetch origin
          git -C edopro/ocgcore submodule update --init lua/src

      - name: premake5
        run: |
          Invoke-WebRequest https://github.com/premake/premake-core/releases/download/v5.0.0-beta8/premake-5.0.0-beta8-windows.zip -OutFile premake.zip
          Expand-Archive premake.zip -DestinationPath premake5

      - name: sqlite3 (vcpkg, static)
        run: vcpkg install sqlite3:x64-windows-static

      - name: Fetch solver deps
        working-directory: ygo-combo-solver
        # The .ps1 default scripts pin predates an upstream history rewrite.
        run: .\tools\fetch_solver_deps.ps1 -ScriptsCommit ff0443efd

      - uses: microsoft/setup-msbuild@v2

      - name: Generate and build (Release x64)
        working-directory: ygo-combo-solver
        run: |
          ..\premake5\premake5.exe vs2022 --vcpkg-root=$env:VCPKG_INSTALLATION_ROOT
          msbuild build\combosolver.sln /m /p:Configuration=Release /p:Platform=x64

      - name: Correctness gate (invariants vs macOS reference)
        working-directory: ygo-combo-solver
        run: python tools/ci/gate.py --binary bin/Release/combosolver.exe --scripts ../deps/scripts_2026-04-13/script

      - name: Write manifest
        working-directory: ygo-combo-solver
        run: |
          @{ solverCommit = "$env:GITHUB_SHA"; target = "x64-windows"; builtAt = (Get-Date -Format o) } |
            ConvertTo-Json | Set-Content bin/Release/manifest.json

      - uses: actions/upload-artifact@v4
        with:
          name: combosolver-win-x64-${{ github.sha }}
          path: |
            ygo-combo-solver/bin/Release/combosolver.exe
            ygo-combo-solver/bin/Release/manifest.json
            ygo-combo-solver/LICENSE
            ygo-combo-solver/NOTICE
